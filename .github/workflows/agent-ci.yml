name: Agent CI

on:
  push:
    branches: [ 'agent/**' ]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - name: دریافت کد
        uses: actions/checkout@v4
      - name: نصب .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: بازیابی وابستگی‌ها
        run: dotnet restore SheepMonitor.sln
      - name: ساخت
        run: dotnet build SheepMonitor.sln --configuration Release --no-restore
      - name: تست
        run: dotnet test tests/SheepMonitor.Tests/SheepMonitor.Tests.csproj --configuration Release --no-build --verbosity normal
